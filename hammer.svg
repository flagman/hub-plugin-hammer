<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 96" width="128" height="96">
  <defs>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3d4652"/>
      <stop offset="0.18" stop-color="#9aa6b4"/>
      <stop offset="0.34" stop-color="#eef3f8"/>
      <stop offset="0.5" stop-color="#aeb9c6"/>
      <stop offset="0.78" stop-color="#5f6b79"/>
      <stop offset="1" stop-color="#2c333c"/>
    </linearGradient>
    <linearGradient id="steelTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="face" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a5562"/>
      <stop offset="0.45" stop-color="#d9e1ea"/>
      <stop offset="1" stop-color="#3a434e"/>
    </linearGradient>
    <linearGradient id="wood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2b17a"/>
      <stop offset="0.35" stop-color="#c58a4f"/>
      <stop offset="0.75" stop-color="#9a6332"/>
      <stop offset="1" stop-color="#6e4421"/>
    </linearGradient>
    <linearGradient id="grip" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a4f57"/>
      <stop offset="0.4" stop-color="#262a30"/>
      <stop offset="1" stop-color="#101215"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="3" dy="6" stdDeviation="3" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <!-- рукоять: дерево с волокнами -->
    <path d="M30 41 L104 38.5 Q110 38.5 110 44 L110 48 Q110 53.5 104 53.5 L30 51 Z" fill="url(#wood)"/>
    <path d="M36 43 Q60 41.5 86 42.5 M38 46.5 Q66 45.5 92 47 M36 49.5 Q58 49 80 50" stroke="#7a4a22" stroke-opacity="0.35" stroke-width="0.8" fill="none"/>
    <path d="M30 41.6 L104 39.2" stroke="#fff" stroke-opacity="0.35" stroke-width="1"/>
    <!-- резиновая ручка -->
    <path d="M84 39.5 L106 38.6 Q112 38.6 112 44 L112 48 Q112 54 106 54 L84 53 Z" fill="url(#grip)"/>
    <path d="M89 39.6 V53 M94 39.4 V53.4 M99 39.2 V53.6 M104 39 V53.8" stroke="#000" stroke-opacity="0.45" stroke-width="1.2"/>
    <path d="M86 40.4 L108 39.6" stroke="#fff" stroke-opacity="0.18" stroke-width="1"/>
    <!-- головка: боёк снизу, гвоздодёр сверху -->
    <path d="M14 30 Q14 24 20 24 L36 24 Q42 24 42 30 L42 62 Q42 66 38 66 L18 66 Q14 66 14 62 Z" fill="url(#steel)"/>
    <path d="M16 6 Q22 12 22 24 L34 24 Q34 14 27 4 Q22 0 16 6 Z" fill="url(#steel)"/>
    <path d="M16 6 Q22 12 22 24" stroke="#1d2228" stroke-opacity="0.5" stroke-width="0.8" fill="none"/>
    <rect x="12" y="62" width="32" height="10" rx="3" fill="url(#face)"/>
    <rect x="12" y="62" width="32" height="3" rx="1.5" fill="#fff" fill-opacity="0.35"/>
    <path d="M14 30 Q14 24 20 24 L36 24 Q42 24 42 30 L42 36 L14 36 Z" fill="url(#steelTop)"/>
    <path d="M14 30 Q14 24 20 24 L36 24 Q42 24 42 30 L42 62 Q42 66 38 66 L18 66 Q14 66 14 62 Z" fill="none" stroke="#000" stroke-opacity="0.35" stroke-width="0.8"/>
    <rect x="12" y="62" width="32" height="10" rx="3" fill="none" stroke="#000" stroke-opacity="0.4" stroke-width="0.8"/>
    <!-- клин в проушине -->
    <rect x="25" y="40" width="7" height="12" rx="1.5" fill="#2b3139" fill-opacity="0.55"/>
  </g>
</svg>
